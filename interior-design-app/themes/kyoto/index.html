<body>
<div id="splash" aria-hidden="true" style="background:#2b2622"><img src="img/brand/themes/kyoto-logo.svg" alt=""></div>
<script>try{if(sessionStorage.getItem("ida-splash"))document.getElementById("splash").remove();else{sessionStorage.setItem("ida-splash","1");setTimeout(function(){var s=document.getElementById("splash");if(s){s.classList.add("out");setTimeout(function(){s.remove()},500)}},1100)}}catch(e){var s=document.getElementById("splash");s&&s.remove()}</script>
<div class="stage">
  <div class="phone" id="app" aria-live="polite"></div>
  <p class="note">日系京都 · POC Demo · 手機版介面（示範資料，存在這台瀏覽器）<a href="#" id="reset">重設示範資料</a><a href="#" id="howto">如何安裝到主畫面</a><a href="themes/" id="themes">五款風格</a></p>
</div>
<div class="modal" id="modal" hidden></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="install.js"></script>
